<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>鹿野工地雷達</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%231c1c1e%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2226%22 fill=%22none%22 stroke=%22%2330d158%22 stroke-width=%226%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%229%22 fill=%22%2330d158%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="radar-dot"></span>鹿野工地雷達</div>
    <div class="top-actions">
      <span id="queue-badge" class="badge hidden" title="待送出"><span class="qi"></span><b>0</b></span>
      <span id="mock-badge" class="badge warn hidden">測試模式</span>
      <button id="btn-mute" class="icon-btn" aria-label="靜音切換"></button>
    </div>
  </header>

  <!-- 開機 / 訊息畫面 -->
  <section id="view-boot" class="view center">
    <div class="panel">
      <div class="scan" id="boot-spin"></div>
      <h2 id="boot-title">連線中…</h2>
      <p id="boot-msg" class="muted"></p>
      <button id="boot-retry" class="btn primary pill block hidden">重新檢查</button>
    </div>
  </section>

  <!-- 地圖主畫面 -->
  <section id="view-map" class="view hidden">
    <div id="filters" class="chips"></div>
    <div id="map"></div>
    <div id="list" class="hidden"></div>
    <div class="map-tools">
      <button id="btn-toggle-list" class="btn small"></button>
      <button id="btn-refresh" class="btn small" aria-label="重新整理"></button>
    </div>
    <button id="btn-mylocation" class="locate-btn" aria-label="回到我的位置" title="回到我的位置"></button>
    <button id="btn-new" class="btn primary fab"></button>
    <div id="sheet-backdrop" class="hidden"></div>
    <div id="sheet" aria-hidden="true"><div class="grip"></div><div id="sheet-body"></div></div>
  </section>

  <!-- 引導式表單 -->
  <section id="view-form" class="view hidden">
    <div class="form-head">
      <button id="form-close" class="icon-btn" aria-label="關閉"></button>
      <div class="progress"><div id="progress-bar"></div></div>
      <span id="step-label" class="step-label">1 / 3</span>
    </div>
    <div id="form-body" class="form-body"></div>
    <div class="form-foot">
      <button id="form-back" class="btn">返回</button>
      <button id="form-next" class="btn primary">下一步</button>
    </div>
  </section>

  <!-- 送出完成 -->
  <section id="view-done" class="view center hidden">
    <div class="panel">
      <div class="done-icon"></div>
      <h2 id="done-title">送出完成</h2>
      <p id="done-msg" class="muted"></p>
      <button id="done-home" class="btn primary pill block">回到雷達</button>
    </div>
  </section>

  <div id="toast"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="js/config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
